<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CoreScript</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css"
media="(prefers-color-scheme: light)">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"
media="(prefers-color-scheme: dark)">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
</head>

<body>

<header>
  <div class="logo">CoreScript</div>
  <nav>
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('downloads')">Downloads</button>
    <button onclick="showPage('csx')">Extensions</button>
    <button onclick="showPage('changelog')">Changelog</button>
    <button onclick="toggleTheme()">🌗</button>
  </nav>
</header>

<section id="hero">
  <h1 id="typing"></h1>
</section>

<main>
  <section id="home"></section>
  <section id="downloads" hidden></section>
  <section id="csx" hidden></section>
  <section id="changelog" hidden></section>
</main>

<script src="app.js"></script>
</body>
</html>
